name: itb
description: >-
  Thin Dart proxy over the libitb shared library's Triple Pipeline
  surface (dart:ffi relay, no build step, no C compiler at run time).
version: 0.4.1
repository: https://github.com/everanium/itb

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  ffi: ^2.1.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
